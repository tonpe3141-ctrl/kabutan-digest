name: 株探ダイジェスト 自動取得

on:
  # 毎日 18:00 JST（= 09:00 UTC）に自動実行（平日のみ）
  schedule:
    - cron: "0 9 * * 1-5"

  # GitHubの画面からボタンで手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 株探ダイジェストを取得してGoogle Docsに保存
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          KABUTAN_DOC_ID: ${{ secrets.KABUTAN_DOC_ID }}
        run: python scraper.py
