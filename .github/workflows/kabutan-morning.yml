name: 株探ダイジェスト【前場】自動取得

on:
  # 毎日 11:55 JST（= 02:55 UTC）に自動実行（平日のみ）
  schedule:
    - cron: "55 2 * * 1-5"

  # GitHubの画面からボタンで手動実行も可能
  workflow_dispatch:

jobs:
  scrape-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 株探ダイジェスト【前場】を取得してGoogle Docsに保存
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          KABUTAN_MORNING_DOC_ID: ${{ secrets.KABUTAN_MORNING_DOC_ID }}
        run: python scraper.py --mode morning
