name: データ源の疎通診断

# 取得元が使えるかをランナー上で実測する診断用ワークフロー。
# データが取れなくなったときに手動実行して原因を切り分ける。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python tools/probe.py
