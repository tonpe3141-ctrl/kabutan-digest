name: データ源の疎通診断

# 取得元が使えるかをランナー上で実測するための一時的なワークフロー。
# 原因の切り分けが済んだら削除してよい。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tools/probe.py
