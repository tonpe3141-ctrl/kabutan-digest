name: データ源の疎通診断

# 取得元が使えるかをランナー上で実測する診断用ワークフロー。
# データが取れなくなったときに手動実行して原因を切り分ける。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: "一時: 信用残の連続取得"
        run: python tools/probe_margin_rate.py
        timeout-minutes: 10
      - name: 信用残・需給の材料（Yahoo の銘柄ページ・JPX・日証金）
        run: python tools/probe_margin.py
        if: always()
      - run: python tools/probe.py
        if: always()
      - name: 候補データ源（株探配信先・追加ランキング）
        run: python tools/probe_sources.py
        if: always()
      - name: 株探ニュース取得モジュールと追加ランキングの実測
        run: python tools/probe_kabutan.py
        if: always()
      - name: 報道・公的機関（株探以外の情報源）
        run: python tools/probe_press.py
        if: always()
      - name: 日足の長期履歴（相場温度計の材料）
        run: python tools/probe_history.py
        if: always()
      - name: 相場温度計の試運転（実データ・コミットしない）
        run: python tools/probe_thermo.py
        if: always()
      - name: 決算から読む の材料（TDnet の PDF・銘柄ページの決算速報）
        run: python tools/probe_earnings.py
        if: always()
