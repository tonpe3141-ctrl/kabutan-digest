name: データ源の疎通診断

# 取得元が使えるかをランナー上で実測する診断用ワークフロー。
# データが取れなくなったときに手動実行して原因を切り分ける。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tools/probe.py
      - name: 候補データ源（株探配信先・追加ランキング）
        run: python tools/probe_sources.py
        if: always()
      - name: 株探ニュース取得モジュールと追加ランキングの実測
        run: python tools/probe_kabutan.py
        if: always()
      - name: 日足の長期履歴（相場温度計の材料）
        run: python tools/probe_history.py
        if: always()
      - name: 相場温度計の試運転（実データ・コミットしない）
        run: python tools/probe_thermo.py
        if: always()
