name: マーケットダッシュボード更新

# 時計は Claude Routine が担う。Routine は時刻どおり（±1分）に発火し、
# docs/data/trigger/{slot}.txt を書いた1コミットを push する。push 先は自分のブランチ（claude/**）に
# 置き換えられることも、main に直接届くこともある（2026-09-28 は3区分とも main に直接届いた）。
# push イベントは cron と違って即時に発火するので、その push でこのワークフローを起動する。
#
# GitHub の schedule はベストエフォートで、実測では毎日2〜7時間遅れていた
# （前場の実行が16〜17時に発火し、大引に振り替えられていた）。cron は保険として
# 1区分1本だけ残す。遅れて発火した場合の取り違えは dashboard.build.adjust_slot が補正する。

on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "docs/data/trigger/*.txt"     # Routine の合図（claude/** か main）
      - "docs/data/watchlist.json"    # アプリからウォッチリストを保存したとき（main）

  schedule:
    - cron: "35 22 * * 0-4"   # 07:35 JST 寄り前の保険
    - cron: "45 2 * * 1-5"    # 11:45 JST 前場の保険
    - cron: "5 9 * * 1-5"     # 18:05 JST 大引の保険

  workflow_dispatch:
    inputs:
      slot:
        description: "更新する区分"
        type: choice
        default: auto
        options: [auto, preopen, zenba, taibike, watchlist]
      date:
        description: "対象日 YYYYMMDD（省略時は今日）"
        type: string
        default: ""

# 同時に走らせない（データファイルの push が衝突するため）
concurrency:
  group: dashboard-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # push 起動のときは、まず合図のブランチを読んで区分を決める
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 実行する区分を決める
        id: slot
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          slot=""
          # この push で合図（trigger/*.txt）が変わったか。main への push は、合図ならその区分を、
          # ウォッチリストの保存だけならウォッチリストの差し替えを走らせる。以前は main への push を
          # すべてウォッチリストの保存とみなしていたため、合図が main に直接届いた日（2026-09-28）に
          # 収集が走らず、寄り前は保険の cron（10:08）まで遅れ、前場は取れなかった
          # 変わったファイルは push の前後のコミットを比べて数える。push イベントの commits[] の
          # added/modified は空で届いていた（2026-09-29〜30 はすべて 0 件になり、main に直接届いた
          # 合図がウォッチリストの保存とみなされて、09-30 の前場・大引の収集が走らなかった）
          trig=0
          if [ "$EVENT" = "push" ]; then
            before=$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git fetch -q --depth=1 origin "$before" "$GITHUB_SHA"; then
              trig=$(git diff --name-only "$before" "$GITHUB_SHA" -- docs/data/trigger/ | wc -l | tr -d ' ')
            elif git fetch -q --depth=2 origin "$GITHUB_SHA"; then
              # 比べる相手が無い（新しいブランチ）ときは、push の最後のコミットだけを見る
              trig=$(git diff --name-only "$GITHUB_SHA~1" "$GITHUB_SHA" -- docs/data/trigger/ | wc -l | tr -d ' ')
            fi
            echo "この push で変わった合図のファイル: ${trig} 件"
          fi
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "${trig:-0}" = "0" ]; then
            # アプリからのウォッチリスト保存。区分は作り直さず、表示中の各区分の
            # ウォッチリストだけ差し替える（休場日に走っても前営業日の区分を消さない）
            slot=watchlist
          elif [ "$EVENT" = "push" ]; then
            # 直近2時間以内に書かれた合図のうち、いちばん新しいものを採用する
            slot=$(python3 - <<'PY'
          import glob, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          best = None
          for path in glob.glob("docs/data/trigger/*.txt"):
              name = os.path.basename(path)[:-4]
              if name not in ("preopen", "zenba", "taibike"):
                  continue
              try:
                  ts = datetime.fromisoformat(open(path, encoding="utf-8").read().strip())
              except Exception:
                  continue
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=timezone(timedelta(hours=9)))
              if now - ts > timedelta(hours=2):
                  continue
              if best is None or ts > best[0]:
                  best = (ts, name)
          print(best[1] if best else "")
          PY
            )
            if [ -z "$slot" ]; then
              echo "有効な合図（2時間以内の trigger ファイル）がありません。何もしません。"
              echo "slot=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            case "$SCHEDULE" in
              "35 22 * * 0-4") slot=preopen ;;
              "45 2 * * 1-5")  slot=zenba ;;
              "5 9 * * 1-5")   slot=taibike ;;
              *)               slot="${INPUT_SLOT:-auto}" ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "実行区分: $slot（起動: $EVENT）"

      # 収集と push は必ず main の上で行う（合図のブランチには書かない）
      - uses: actions/checkout@v4
        if: steps.slot.outputs.slot != ''
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.slot != ''
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.slot.outputs.slot != ''

      # 取得元のページ構造が変わるとパーサが黙って壊れるので、収集前に検査する
      - name: パーサの回帰テスト
        if: steps.slot.outputs.slot != ''
        run: python tests/test_parsers.py

      - name: データを収集して JSON を更新
        if: steps.slot.outputs.slot != ''
        run: |
          args="--slot ${{ steps.slot.outputs.slot }}"
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          # 保険の cron は、Routine の合図でその日の区分が既に作られていれば何もしない
          # （2〜7時間遅れて発火し、夜に取り直して東証33業種や記事が欠けた実測があるため）
          if [ "${{ github.event_name }}" = "schedule" ]; then args="$args --insurance"; fi
          python -m dashboard.build $args

      # 古い app.js をブラウザが掴んだままにならないよう内容ハッシュを打つ
      - name: 静的ファイルにハッシュを付ける
        if: steps.slot.outputs.slot != ''
        run: python tools/stamp_assets.py

      - name: 変更をコミットして公開
        if: steps.slot.outputs.slot != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
            exit 0
          fi
          git commit -m "データ更新: ${{ steps.slot.outputs.slot }} ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push に失敗。$((2 ** i)) 秒待って再試行します。"
            sleep $((2 ** i))
          done
          echo "push に失敗しました" >&2
          exit 1
